
services:
  postgres:
    image: postgres:17-alpine
    container_name: PostgresLifeFit
    restart: always
    environment:
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: life_fit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: